name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install on the GitHub runner
        run: python -m pip install '.[test]'
      - name: Run all tests and enforce coverage
        run: python -m pytest
      - name: Report measured tests and coverage
        if: always() && hashFiles('coverage.xml') != ''
        run: python ci/measure.py
      - name: Run CLI on all three synthetic examples
        run: python ci/run_examples.py
      - name: Install PDF renderer on the GitHub runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Render every PDF page for visual review
        run: python ci/render_pdfs.py
      - name: Record runner dependencies
        if: always()
        run: python -m pip freeze > ci-output/dependencies.txt
      - name: Upload drafts, rendered pages, tests, and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-drafts-and-reports
          path: |
            generated/
            ci-output/
            htmlcov/
            coverage.xml
          if-no-files-found: error
