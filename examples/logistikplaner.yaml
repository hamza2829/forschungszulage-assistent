title: Adaptiver Tourenplaner für synthetische Liefernetze
organization: Fiktiva Logistiklabor GmbH
goal: Ein Verfahren soll unter wechselnden Aufträgen die Planstabilität gegenüber einer festgelegten heuristischen Basis verbessern. Ziel sind mindestens 15 Prozent weniger Umplanungen bei gleicher Einhaltung der Zeitfenster.
technical_problem: Im synthetischen Liefernetz wechseln Aufträge während der Planung. Die Kombination aus knappen Zeitfenstern und unvollständigen Laufzeitinformationen führt bei der bisherigen Heuristik zu instabilen Plänen.
state_of_art: Eine einfache Einfügeheuristik und ein statischer Optimierer dienen als Vergleich. Beide Verfahren werden auf identischen synthetischen Instanzen mit dokumentierten Parametern untersucht. Literaturbelege sind noch zu ergänzen.
novelty: Untersucht wird eine neue Kopplung von Unsicherheitsschätzung und lokaler Nachplanung. Der angestrebte Erkenntnisgewinn betrifft den Zusammenhang zwischen Schätzfehlern und stabiler Lösungsqualität gegenüber den beiden Referenzen.
hypothesis: Eine explizite Begrenzung der durch Schätzunsicherheit ausgelösten Suchschritte kann die Anzahl unnötiger Umplanungen reduzieren, ohne die Einhaltung der Zeitfenster zu verschlechtern.
approach: Zwei eigene Varianten der Nachplanung werden in Ablationsversuchen gegen beide Referenzverfahren getestet. Unterschiedliche Lastmuster und Schätzfehler werden kontrolliert variiert.
technical_uncertainty: Es ist technisch unklar, ob die adaptive Suchbegrenzung bei stark wechselnder Last konvergiert. Das Verfahren kann an widersprüchlichen Zeitfenstern scheitern und dann schlechter als die Referenz werden.
measurement_plan: Für 100 synthetische Instanzen werden Umplanungszahl, Zeitfensterverletzungen und Laufzeit gemessen. Je Variante erfolgen 20 Wiederholungen mit festgehaltenen Zufallswerten und einem vorher festgelegten Vergleich.
reproducibility_plan: Generator, Instanzen, Parameter, Softwareversionen und Zufallswerte werden versioniert. Ein Auswertungsskript rekonstruiert die Tabellen aus unveränderten Rohdaten und protokolliert die Versuchsumgebung.
risks: Bei ausbleibender Verbesserung werden die Hypothesen dokumentiert verworfen. Ein Abbruchkriterium ist eine anhaltende Verschlechterung der Zeitfensterquote gegenüber der Basis. Produktintegration bleibt ein getrenntes Routinepaket.
